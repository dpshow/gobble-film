/* ---------- tokens -------------------------------------------------------- */
:root{
  --paper:#faf5eb; --paper-2:#f5f0e6; --cream:#ebe6dc; --cream-line:#e1dcd2;
  --red:#e6001e; --red-dark:#be001e; --maroon:#500a14; --acid:#e6f032;
  --white:#fff; --black:#000;
  --wrapw:1600px; --gut:24px; --inset:80px;
  --display:'Big Shoulders',Impact,'Haettenschweiler',sans-serif;
  --body:'Onest','Helvetica Neue',Helvetica,Arial,sans-serif;
  --edge:var(--red-dark);
  --shadow:#e6e1d8; --shadow-cream:#d8d4ca; --shadow-white:#eaeaea;
  --dot:#e4ddcd;
  --dots:radial-gradient(circle at 50% 50%, var(--dot) 1.15px, transparent 1.2px) 0 0/26px 26px;
}

/* ---------- base ---------------------------------------------------------- */
*,::before,::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  margin:0;overflow-x:clip;
  background:var(--paper);color:var(--red-dark);
  font:400 20px/28px var(--body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,figure,blockquote{margin:0;padding:0}
ul{list-style:none}
.wrap{width:min(var(--wrapw), 100% - var(--gut)*2);margin-inline:auto}
h1{text-wrap:balance}
p,li{text-wrap:pretty}
.skip{position:absolute;left:-9999px;top:0;background:var(--acid);color:var(--red-dark);padding:10px 16px;z-index:99}
.skip:focus{left:12px;top:12px}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* ---------- bands --------------------------------------------------------- */
.band{position:relative;padding:90px 0}
.band > .wrap{padding-inline:var(--inset)}
.band--paper{background:var(--dots), var(--paper)}
.head{background:var(--dots), var(--paper);padding-bottom:80px;overflow:hidden}

/* ---------- header -------------------------------------------------------- */
.nav{position:relative;z-index:3;display:flex;align-items:center;gap:40px;height:146px;padding-left:var(--inset)}
.nav__logo{position:relative;z-index:60}
.nav__logo img{width:200px;height:20px;position:relative;top:-2.75px}

/* ---------- footer -------------------------------------------------------- */
.foot{height:560px;background:var(--white);color:var(--black);font:400 20px/30px var(--body);--shadow:var(--shadow-white)}
.foot--slim{height:auto;background:var(--paper);--shadow:var(--shadow-cream)}
.foot--slim .foot__base{margin-top:0;padding-block:34px}
.foot__base{display:flex;align-items:center;gap:21px;margin-top:71.5px}
.foot__logo img{width:200px;height:20px}
.foot__social{display:flex;gap:10px}
.foot__social a{
  display:grid;place-items:center;width:30px;height:30px;border-radius:3px;
  background:var(--acid);color:var(--red-dark);
  border:.5px solid var(--edge);box-shadow:2px 2px 0 0 var(--shadow);
  transition:transform .14s cubic-bezier(.2,.8,.25,1), background .14s, box-shadow .14s;
}
.foot__social a:hover{transform:translate(-1px,-1px);background:var(--red);color:var(--acid);box-shadow:3px 3px 0 0 var(--shadow)}
.foot__social svg{width:100%;height:100%;fill:currentColor;display:block}
.foot__copy{font-weight:400;font-size:15px;color:var(--black);line-height:1}

/* ---------- the entrance --------------------------------------------------
   A red plate with the wordmark punched out of it, and the hole grows until
   it is off the screen. The plate is in the markup but only shown when the
   inline script in <head> sets data-intro, so there is no flash either way,
   and it is removed on a timer whatever happens. Delete the .intro div, this
   block and the first <script> in <head> to drop it. */
.intro{display:none}
html[data-intro] .intro{display:block;position:fixed;inset:0;z-index:9999;pointer-events:none;--veil:1;--hole:42vmin}
.intro__solid{position:absolute;inset:0;background:var(--red);opacity:var(--veil)}
.intro__cover{
  position:absolute;inset:0;background:var(--acid);
  -webkit-mask-image:linear-gradient(#000 0 0), url('intro-mark.svg');
          mask-image:linear-gradient(#000 0 0), url('intro-mark.svg');
  -webkit-mask-repeat:no-repeat,no-repeat;  mask-repeat:no-repeat,no-repeat;
  -webkit-mask-position:center,center;      mask-position:center,center;
  -webkit-mask-size:100% 100%, var(--hole) calc(var(--hole)/10);
          mask-size:100% 100%, var(--hole) calc(var(--hole)/10);
  -webkit-mask-composite:xor;               mask-composite:exclude;
}
@media (prefers-reduced-motion:reduce){ .intro{display:none !important} }

/* ---------- breakpoints --------------------------------------------------- */
@media (max-width:1560px){
  .band > .wrap{padding-inline:0}
  .foot__base{margin-top:56px;padding:0 0 72px;flex-wrap:wrap;row-gap:16px}
}
@media (max-width:1000px){

  .foot{font-size:18px;line-height:26px}
  .foot__copy{font-size:18px}
}
@media (max-width:520px){
  body{font-size:18px;line-height:23px}
}

<style>
/* ==========================================================================
   GOBBLE GOBBLE, HIP HOORAY — the film
   Sister of /GobbleGobbleHipHooray, the song page: same header with the mark
   alone, same lyric, same footer. The audio player is replaced by the film,
   and the lyric now runs on the video's clock.
   The timings are the song's, checked line by line against a transcription of
   the video's own audio — 0.04s apart at the worst. The 5.4s the film has over
   the song are tail, after the last line.
   This page's CSS and JS live inside it on purpose: one file, one request, and
   nothing for the rest of the site to carry.
   ========================================================================== */
.gg{overflow:hidden;padding-top:28px;--stage-h:clamp(300px, calc(100vh - 210px), 780px);--caption-h:96px}
.gg{--stage-h:clamp(300px, calc(100dvh - 210px), 780px)}
.head--nav{padding-bottom:0}      /* no opening copy on this page */
.nav--mark{justify-content:center;padding-left:0}

.gg__stage{
  position:relative;
  display:grid;place-items:center;
}

/* The card is as wide as the film: 16:9 of whatever height is left once the
   caption has taken its share. Without that third limit, an 1100px card in a
   short window would push its own caption off the screen. */
.gg__screen{
  position:relative;
  width:min(1100px, 100%, calc((var(--stage-h) - var(--caption-h)) * 16 / 9));
  background:var(--paper);
  border:.5px solid var(--red-dark);border-radius:6px;
  box-shadow:10px 10px 0 0 rgba(0,0,0,.14);
}
.gg__film{
  position:relative;
  aspect-ratio:16/9;background:#000;
  border-radius:5px 5px 0 0;overflow:hidden;
  border-bottom:.5px solid var(--red-dark);
}
/* contain, not cover: if the sums get tight the film gets bars, never a crop */
.gg__film video{display:block;width:100%;height:100%;object-fit:contain}

/* The same play chip as the Sideshow page, only bigger: radius, border and
   shadow keep their proportions (50/5/.5/5 becomes 88/8/.5/7). The shadow is
   translucent because this one sits on artwork, where the house's hard shadow
   would read as an opaque block. */
.gg__play{
  position:absolute;left:50%;top:50%;z-index:2;
  display:grid;place-items:center;
  width:88px;height:88px;padding:0;box-sizing:border-box;
  border-radius:8px;cursor:pointer;
  background:var(--acid);color:var(--red);
  border:.5px solid var(--red-dark);
  box-shadow:7px 7px 0 0 rgba(0,0,0,.16);
  transform:translate(-50%,-50%);
  transition:transform .2s ease, opacity .2s ease;
}
.gg__play:hover{transform:translate(-50%,-50%) scale(1.06)}
.gg__play svg{width:38px;height:38px}
.gg__play .gg__arrow{margin-left:4px}   /* the triangle is left-heavy */
.gg__play .gg__again{display:none}
/* while it plays, the chip gets out of the film's way */
.gg.is-playing .gg__play{opacity:0;pointer-events:none}
.gg.is-ended .gg__play .gg__again{display:block}
.gg.is-ended .gg__play .gg__arrow{display:none}
/* The film ends on the end card, and a chip in the middle landed right on the
   "&" of the logo. Once the film is over it moves to the top corner: clear of
   the mark, clear of the line of type, and clear of the control bar along the
   bottom. Paused mid-film it stays in the middle — any frame is as good as any
   other there, and the middle is where the hand looks. */
.gg.is-ended .gg__play{left:auto;right:20px;top:20px;transform:none}
.gg.is-ended .gg__play:hover{transform:scale(1.06)}

.gg__cap{
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  padding:20px 26px 22px;
}
.gg__eyebrow{
  margin:0 0 7px;
  font-family:var(--display);font-weight:700;
  font-variation-settings:'opsz' 14,'wght' 700;
  font-size:19px;line-height:1;text-transform:uppercase;color:var(--red);
}
.gg__title{
  margin:0;
  font-family:var(--display);font-weight:700;
  font-variation-settings:'opsz' 72,'wght' 700;
  font-size:38px;line-height:36px;text-transform:uppercase;color:var(--red-dark);
}
.gg__dur{
  flex:0 0 auto;font:400 17px/1 var(--body);color:var(--red-dark);
  font-variant-numeric:tabular-nums;
}

/* ---------- the lyric ----------------------------------------------------- */
.gg__lyrics{
  position:relative;z-index:2;
  width:min(720px, 100%);margin:26px auto 0;
}
.gg__scroll{
  position:relative;        /* so the lines' offsetTop is measured from here */
  height:clamp(320px, 50vh, 520px);
  overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;
  /* the text fades in and out instead of hitting a hard edge */
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 14%,#000 86%,transparent 100%);
}
.gg__scroll::-webkit-scrollbar{width:0}
.gg__list{list-style:none;margin:0;padding:38% 0;text-align:center}
.gg__sec{
  display:block;margin:30px 0 10px;
  font-family:var(--display);font-weight:700;
  font-variation-settings:'opsz' 14,'wght' 700;
  font-size:17px;line-height:1;text-transform:uppercase;color:var(--red);opacity:.75;
}
.gg__list > li:first-child .gg__sec{margin-top:0}
.gg__line{
  margin:0;padding:8px 10px;
  font:400 23px/31px var(--body);color:var(--maroon);opacity:.34;
  cursor:pointer;background:none;border:0;width:100%;
  transition:opacity .3s ease, transform .3s ease, color .3s ease;
}
.gg__line:hover{opacity:.6}
.gg__line.is-past{opacity:.3}
.gg__line.is-now{
  opacity:1;color:var(--red-dark);font-weight:500;
  transform:scale(1.05);
}
.gg__w{transition:opacity .2s ease, color .2s ease}
.gg__line.is-now .gg__w{opacity:.38}
.gg__line.is-now .gg__w.is-sung{opacity:1}
.gg__line.is-past .gg__w{opacity:1}

/* ---------- the sign-off ---------------------------------------------------
   Everything on this page runs down the middle — the film, the lyric — and a
   sign-off pinned to the left margin broke that plumb line. Here only: on the
   rest of the site .foot__base still starts at the edge of the wrap. */
.foot--mid .foot__base{justify-content:center;flex-wrap:wrap;row-gap:14px}

@media (max-height:820px){
  /* short window: the caption gives up its height and the film takes it */
  .gg{--caption-h:78px}
  .gg__cap{padding:15px 22px 17px}
  .gg__title{font-size:30px;line-height:29px}
  .gg__eyebrow{font-size:17px;margin-bottom:5px}
  .gg__lyrics{margin-top:18px}
}
@media (max-width:760px){
  .gg{--stage-h:clamp(260px, calc(100dvh - 190px), 780px);--caption-h:86px}
  .gg__screen{width:min(100%, calc((var(--stage-h) - var(--caption-h)) * 16 / 9))}
  .gg__play{width:64px;height:64px;border-radius:6px;box-shadow:5px 5px 0 0 rgba(0,0,0,.16)}
  .gg__play svg{width:28px;height:28px}
  .gg.is-ended .gg__play{right:12px;top:12px}
  .gg__cap{padding:14px 16px 16px;gap:12px}
  .gg__title{font-size:26px;line-height:25px}
  .gg__line{font-size:20px;line-height:27px}
}
@media (max-width:420px){
  .gg__title{font-size:23px;line-height:23px}
  .gg__dur{display:none}   /* the film's own controls already show it */
}
@media (prefers-reduced-motion:reduce){
  .gg__scroll{scroll-behavior:auto}
  .gg__line.is-now{transform:none}
}
</style>

  const lines = LYRICS.lines.map((l, i) => {

    if (l.sec) {

<script>
/* ------------------------------------------------------------------ entrance
   The plate is already in the markup and shown only when the inline script in
   <head> set data-intro, so there is no flash either way. All this does is
   grow the hole, and remove the plate whatever happens.
   Delete this script, the .intro div and the .intro block in the stylesheet
   to drop the entrance entirely — nothing else depends on it.
   ========================================================================== */
(function () {
  const intro = document.querySelector('.intro');
  if (!intro || !document.documentElement.dataset.intro) return;

  const OPEN_MS = 1300;
  const HOLD_MS = 320;      // let the mark be seen before it opens
  const WAIT_MS = 1600;     // ceiling on waiting for fonts

  const short = Math.min(innerWidth, innerHeight);
  const long  = Math.max(innerWidth, innerHeight);
  const from  = short * 0.42;   // hole width; the mark is 10:1, so 1/10 tall
  const to    = long * 14;      // wide enough that its tenth clears the height

  // Quartic in and out: slow to start, quick to finish.
  const ease = t => t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

  function paint(t) {
    const e = ease(t);
    // Growth is exponential — linear reads as braking, because the eye judges
    // size in proportion.
    intro.style.setProperty('--hole', from * Math.pow(to / from, e) + 'px');
    intro.style.setProperty('--veil', 1 - Math.min(1, Math.max(0, (e - 0.3) / 0.28)));
    intro.style.opacity = 1 - Math.min(1, Math.max(0, (e - 0.82) / 0.18));
  }

  paint(0);

  let running = false;
  function run() {
    if (running) return;
    running = true;

    // requestAnimationFrame never fires in a background tab, which would leave
    // the plate frozen on its first frame. Nobody is watching an entrance they
    // cannot see, so skip straight to the page.
    if (document.hidden) { intro.remove(); return; }

    const started = performance.now();
    (function step(now) {
      const t = Math.min(1, (now - started) / OPEN_MS);
      paint(t);
      if (t < 1) requestAnimationFrame(step);
      else intro.remove();
    })(performance.now());
  }

  // Last resort: whatever happens, the plate is gone by this point.
  setTimeout(() => intro.remove(), WAIT_MS + OPEN_MS + 600);

  const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
  setTimeout(run, WAIT_MS);
  setTimeout(() => fonts.then(run), HOLD_MS);
})();
</script>
